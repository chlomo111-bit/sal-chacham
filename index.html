  const icon=document.getElementById('cicon'),cnt=document.getElementById('ccount');let n=0;cnt.textContent=0;
  citems.querySelectorAll('.ci').forEach((el,i)=>{if(el.dataset.miss)return;setTimeout(()=>{
    const name=el.querySelector('.top div').firstChild.textContent;
    flyTo(name,el,icon,()=>{n++;cnt.textContent=n;icon.classList.remove('bump');void icon.offsetWidth;icon.classList.add('bump')})},350+i*110)})}
function renderCart(intro){const st=cartStore;let tot=0;citems.innerHTML='';let idx=0;
  cartLines.forEach(cl=>{const L=cl.L,d=document.createElement('div');d.className='ci';
    if(intro){d.classList.add('pop');d.style.animationDelay=(idx++*60)+'ms'}
    if(cl.sel<0){d.dataset.miss=1;d.innerHTML=`<div class="top"><div>${L.label}<small style="color:#ff8a9c">לא נמכר בסניף הזה</small></div></div>`;citems.appendChild(d);return}
    const x=L.c[cl.sel],p=x.p[st.id]*L.q;tot+=p;
    d.innerHTML=`<div class="top"><div>${L.q>1?L.q+'× ':''}${L.label}<small>${x.m||x.n}</small></div><span class="pr">₪${p.toFixed(2)}</span><button class="sw">החלף ▾</button></div><div class="alts"></div>`;
    const al=d.querySelector('.alts');
    L.c.map((y,k)=>[y,k]).filter(([y])=>y.p[st.id]!=null).sort((a,b)=>a[0].p[st.id]-b[0].p[st.id]).forEach(([y,k])=>{
      const a=document.createElement('div');a.className='alt'+(k===cl.sel?' sel':'');
      a.innerHTML=`<span>${y.m?y.m+' · ':''}${MODE==='real'?y.n:''}</span><span>₪${(y.p[st.id]*L.q).toFixed(2)}</span>`;a.onclick=()=>{cl.sel=k;renderCart()};al.appendChild(a)});
    d.querySelector('.sw').onclick=()=>d.classList.toggle('open');citems.appendChild(d)});
  document.getElementById('ctot').textContent='₪'+tot.toFixed(2);st.cartTotal=tot}
document.getElementById('cclose').onclick=()=>cart.classList.remove('on');
const orderItems=()=>cartLines.filter(c=>c.sel>=0).map(c=>{const x=c.L.c[c.sel];return {q:c.L.q,name:MODE==='real'?x.n:c.L.label,brand:x.m||'',barcode:MODE==='real'?x.id:''}});
let hasExt=false;
window.addEventListener('message',e=>{if(e.data&&e.data.type==='SAL_ACK')hasExt=true;if(e.data&&e.data.type==='SAL_SENT')document.getElementById('cmsg').textContent='נשלח לתוסף ✓ האתר של הרשת נפתח בכרטיסייה חדשה'});
try{window.postMessage({type:'SAL_PING'},'*')}catch(e){}
document.getElementById('order').onclick=()=>{const st=cartStore,ext=st.chain==='rami';
  document.getElementById('dtitle').textContent=`הזמנה ב${st.name} · ₪${st.cartTotal.toFixed(2)}`;
  document.getElementById('extgo').style.display=ext?'block':'none';
  document.getElementById('cmsg').innerHTML=ext?'':`מילוי אוטומטי עדיין רק ברמי לוי. <a href="${ORDER_SITES[st.chain]||'#'}" style="color:#4bb8ff">לאתר של ${CHAINS[st.chain]?CHAINS[st.chain].name:st.name}</a>`;
  document.getElementById('done').style.display='flex'};
document.getElementById('extgo').onclick=()=>{const m=document.getElementById('cmsg');
  if(!hasExt){m.textContent='צריך להתקין את התוסף "סל חכם" ב-Chrome במחשב';return}
  window.postMessage({type:'SAL_ORDER',store:cartStore.chain,items:orderItems()},'*')};
document.getElementById('dclose').onclick=()=>document.getElementById('done').style.display='none';
document.getElementById('copy').onclick=async()=>{const t='תזמין לי ב'+cartStore.name+':\n'+orderItems().map(i=>`${i.q}× ${i.name}${i.brand?' – '+i.brand:''}`).join('\n');
  const m=document.getElementById('cmsg');try{await navigator.clipboard.writeText(t);m.textContent='הועתק ✓ אפשר להדביק בתוסף או בצ׳אט'}catch(e){m.textContent=t}};

/* ================== BOUTONS ================== */
document.getElementById('go').onclick=()=>runLines(makeLines(LIST.filter(x=>x.on)));
document.getElementById('again').onclick=()=>{sheet.classList.remove('min');clearInterval(timer);resEl.style.display='none';listEl.style.display='none'};
const RECEIPT=['חלב 3% 1 ל׳|2','לחם אחיד|1','ביצים L 12|1','קוטג׳ 5%|3','גבינה צהובה 200 ג׳|1','חזה עוף 1 ק״ג|1','עגבניות 1 ק״ג|1','מלפפונים 1 ק״ג|1','בננה 1 ק״ג|1','במבה 80 ג׳|2','קפה טורקי 200 ג׳|1','פסטה 500 ג׳|2','שמן קנולה 1 ל׳|1','נייר טואלט 32|1','קוקה קולה 1.5 ל׳|2'].map(s=>{const[n,q]=s.split('|');return{n,q:+q}});
document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;
  const sc=document.getElementById('scan');document.getElementById('rimg').src=URL.createObjectURL(f);sc.style.display='flex';
  setTimeout(()=>{sc.style.display='none';runLines(makeLines(RECEIPT),'shufersal')},2400);e.target.value=''};
const modebtn=document.getElementById('modebtn');
function setMode(simple){document.body.classList.toggle('simple',simple);modebtn.textContent=simple?'🗺️ מפה תלת-ממד':'📋 תצוגה פשוטה';LS.set('sal_simple',simple)}
modebtn.onclick=()=>setMode(!document.body.classList.contains('simple'));

/* ================== DÉMARRAGE ================== */
const citySel=document.getElementById('city'),datanote=document.getElementById('datanote');
let CITIES=CITY_LIST;
async function useCity(id){
  CITY=CITIES.find(c=>c.id===id)||CITIES[0];citySel.value=CITY.id;LS.set('sal_city',CITY.id);
  clearInterval(timer);LINES=[];resEl.style.display='none';listEl.style.display='none';bigT=0;cart.classList.remove('on');sheet.classList.remove('min');
  MODE='demo';try{await loadReal()}catch(e){buildDemo()}
  buildStores();zoomT0=clock.getElapsedTime();
  const ban=document.getElementById('cityban');ban.textContent='📍 '+CITY.name;ban.classList.remove('on');void ban.offsetWidth;ban.classList.add('on');
  status.textContent=`${STORES.length} סניפים ב${CITY.name} · סמנו מה צריך ולחצו "השווה מחירים"`;
  datanote.textContent=MODE==='real'?`מחירים אמיתיים מקבצי שקיפות המחירים · ${CITY.name} · עודכן ${UPDATED}`
    :`מצב דמו · מחירים וסניפים לדוגמה (המחירים האמיתיים של ${CITY.name} יופיעו אחרי חיבור השרת)`}
citySel.onchange=()=>useCity(citySel.value);
document.getElementById('locbtn').onclick=()=>{
  if(!navigator.geolocation){datanote.textContent='אין גישה למיקום בדפדפן הזה – בחרו עיר מהרשימה';return}
  navigator.geolocation.getCurrentPosition(p=>{const{latitude:a,longitude:o}=p.coords;
    let best=CITIES[0],bd=1e9;CITIES.forEach(c=>{if(c.lat==null)return;const d=(c.lat-a)**2+(c.lng-o)**2;if(d<bd){bd=d;best=c}});useCity(best.id)},
    ()=>{datanote.textContent='לא קיבלתי מיקום – בחרו עיר מהרשימה'})};
(async()=>{
  CITIES=await loadCities();
  citySel.innerHTML=CITIES.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  renderList();setMode(LS.get('sal_simple',false));loop();
  const stEl=document.getElementById('splashstatus'),t0=Date.now();
  await useCity(LS.get('sal_city','rishon'));
  if(stEl)stEl.textContent=MODE==='real'?'מחירים עדכניים נטענו ✓':'נטען במצב הדגמה';
  const sp=document.getElementById('splash'),hide=()=>{sp.classList.add('hide');setTimeout(()=>sp.remove(),800);zoomT0=clock.getElapsedTime();STORES.forEach((st,i)=>st.t0=zoomT0+.3+i*.13)};
  sp.onclick=hide;setTimeout(hide,Math.max(500,2600-(Date.now()-t0)));
})();
</script>
</body>
